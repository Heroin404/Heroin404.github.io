<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Random Masterworks — вертикальная лента шедевров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121016;
    --bg-elev:#1a1620;
    --cream:#f3ede0;
    --muted:#a79f8f;
    --gold:#c9a15c;
    --gold-dim:#8a7245;
    --like:#c14b3f;
    --line: rgba(201,161,92,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#000;overscroll-behavior:none;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--cream);}

  #feed{
    height:100dvh;
    width:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  #feed::-webkit-scrollbar{display:none;}

  .slide{
    position:relative;
    height:100dvh;
    width:100%;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    overflow:hidden;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .art-frame{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
  }
  .art-frame::before{
    content:"";
    position:absolute; inset:0;
    background-image:inherit;
    background-size:cover;
    background-position:center;
    filter:blur(38px) brightness(0.4) saturate(1.1);
    transform:scale(1.15);
  }
  .art-img{
    position:relative;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    box-shadow:0 30px 90px rgba(0,0,0,0.55);
    opacity:0;
    transition:opacity .5s ease;
  }
  .art-img.loaded{opacity:1;}

  .scrim-top{
    position:absolute; top:0; left:0; right:0; height:22%;
    background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    pointer-events:none; z-index:2;
  }
  .scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:46%;
    background:linear-gradient(0deg, rgba(0,0,0,0.72), rgba(0,0,0,0));
    pointer-events:none; z-index:2;
  }

  .eyebrow{
    position:absolute; top:18px; left:20px; z-index:3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold);
  }
  .counter{
    position:absolute; top:18px; right:20px; z-index:3;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.1em;
    color:var(--muted);
  }

  .plaque{
    position:absolute; left:20px; right:88px; bottom:28px; z-index:3;
    max-width:520px;
  }
  .plaque-rule{
    width:38px; height:1px; background:var(--gold); margin-bottom:12px;
  }
  .plaque-title{
    font-family:'Fraunces',serif;
    font-weight:500; font-size:22px; line-height:1.25;
    margin:0 0 6px 0; color:var(--cream);
    transition:opacity .25s ease;
  }
  .plaque-artist{
    font-size:14px; color:var(--gold); margin:0 0 4px 0; font-weight:500;
    transition:opacity .25s ease;
  }
  .plaque-meta{
    font-size:12.5px; color:var(--muted); margin:0; line-height:1.5;
    transition:opacity .25s ease;
  }
  .plaque-extra{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .35s ease, opacity .35s ease, margin-top .35s ease;
  }
  .plaque-extra.open{
    max-height:140px; opacity:1; margin-top:10px;
  }
  .plaque-acc{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold-dim);
    letter-spacing:.05em;
  }
  .plaque-medium{
    font-size:12.5px; color:var(--muted); margin-top:6px; font-style:italic;
    font-family:'Fraunces',serif;
    transition:opacity .25s ease;
  }
  .fade-swap{ opacity:0.35; }

  .rail{
    position:absolute; right:14px; bottom:104px; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .rail-btn{
    background:none; border:none; color:var(--cream); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:'Inter',sans-serif; font-size:10.5px; color:var(--muted);
    padding:0; width:46px;
  }
  .rail-btn svg{width:26px; height:26px; display:block; margin:0 auto;}
  .rail-btn.like.active svg{ fill:var(--like); stroke:var(--like); }
  .rail-btn.info.active{ color:var(--gold); }
  .rail-circle{
    width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(243,237,224,0.28);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .rail-btn:active .rail-circle{ transform:scale(0.88); }
  .rail-btn.info.active .rail-circle{ border-color:var(--gold); }

  .heart-burst{
    position:absolute; z-index:5; pointer-events:none;
    width:110px; height:110px;
    left:50%; top:50%; transform:translate(-50%,-50%) scale(0.3);
    opacity:0;
  }
  .heart-burst.play{
    animation:burst .8s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burst{
    0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0; }
    18%{ transform:translate(-50%,-50%) scale(1.05); opacity:0.95; }
    35%{ transform:translate(-50%,-50%) scale(0.95); opacity:0.95; }
    100%{ transform:translate(-50%,-50%) scale(1); opacity:0; }
  }

  .status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color:var(--muted); font-size:13px;
    text-align:center; padding:0 40px;
  }
  .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2px solid rgba(201,161,92,0.25); border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .retry-btn{
    margin-top:6px; background:none; border:1px solid var(--gold-dim);
    color:var(--gold); font-family:'Inter',sans-serif; font-size:12.5px;
    padding:8px 18px; border-radius:2px; cursor:pointer; letter-spacing:.03em;
  }
  .retry-btn:hover{ border-color:var(--gold); }

  #boot{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #boot .mark{
    font-family:'Fraunces',serif; font-weight:300; font-size:26px; color:var(--cream);
    letter-spacing:.02em;
  }
  #boot .sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); letter-spacing:.16em; text-transform:uppercase; }

  #hint{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    z-index:20; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--muted); letter-spacing:.08em; text-transform:uppercase;
    display:flex; align-items:center; gap:8px; opacity:0.85;
    animation:float 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes float{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-6px);} }

  #settings-gear{
    position:fixed; right:16px; bottom:18px; z-index:30;
    width:44px; height:44px; border-radius:50%;
    background:rgba(18,16,22,0.65);
    border:1px solid rgba(201,161,92,0.4);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--gold);
    transition:transform .15s ease, border-color .15s ease;
  }
  #settings-gear:hover{ border-color:var(--gold); }
  #settings-gear:active{ transform:scale(0.9); }
  #settings-gear svg{ width:22px; height:22px; }
  #settings-gear.spin svg{ animation:gearspin .6s ease; }
  @keyframes gearspin{ to{ transform:rotate(75deg); } }

  #settings-panel{
    position:fixed; right:16px; bottom:70px; z-index:31;
    background:var(--bg-elev);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    min-width:190px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
    display:none;
    flex-direction:column;
    gap:10px;
  }
  #settings-panel.open{ display:flex; }
  #settings-panel .panel-title{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:0 0 2px 0;
  }
  .lang-option{
    display:flex; align-items:center; justify-content:space-between;
    background:none; border:1px solid rgba(243,237,224,0.15);
    color:var(--cream); font-family:'Inter',sans-serif; font-size:13px;
    padding:9px 12px; border-radius:6px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .lang-option:hover{ border-color:var(--gold-dim); }
  .lang-option.active{
    border-color:var(--gold); background:rgba(201,161,92,0.1); color:var(--gold);
  }
  .lang-option .dot{
    width:7px; height:7px; border-radius:50%; background:var(--gold);
    opacity:0; transition:opacity .15s ease;
  }
  .lang-option.active .dot{ opacity:1; }
  .panel-note{
    font-size:10.5px; color:var(--muted); line-height:1.5; margin-top:2px;
  }

  @media (max-width:640px){
    .plaque{ right:76px; }
    .plaque-title{ font-size:19px; }
    .rail{ right:10px; gap:16px; }
  }
</style>
</head>
<body>

<div id="boot">
  <div class="mark">Random Masterworks</div>
  <div class="sub" id="boot-sub">собираем ленту</div>
  <div class="spinner"></div>
</div>

<div id="feed"></div>
<div id="hint">↑ ↓ листайте, как ленту ↑ ↓</div>

<div id="settings-gear" aria-label="Настройки">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56v.17a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.6a2.06 2.06 0 1 1 0-4.12h.09A1.7 1.7 0 0 0 6.25 7.3a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34H10.8a1.7 1.7 0 0 0 1.03-1.56V1.1a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03h.17a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03z"/>
  </svg>
</div>

<div id="settings-panel">
  <p class="panel-title" id="panel-title">Язык</p>
  <button class="lang-option" data-lang="ru"><span>Русский</span><span class="dot"></span></button>
  <button class="lang-option" data-lang="en"><span>English</span><span class="dot"></span></button>
  <p class="panel-note" id="panel-note">Тексты картин переводятся автоматически.</p>
</div>

<template id="slide-tpl">
  <section class="slide">
    <div class="art-frame">
      <img class="art-img" alt="">
    </div>
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="eyebrow">Random Masterworks</div>
    <div class="counter"></div>

    <div class="plaque">
      <div class="plaque-rule"></div>
      <p class="plaque-title"></p>
      <p class="plaque-artist"></p>
      <p class="plaque-meta"></p>
      <div class="plaque-extra">
        <div class="plaque-medium"></div>
        <div class="plaque-acc"></div>
      </div>
    </div>

    <div class="rail">
      <button class="rail-btn like" aria-label="Like">
        <span class="rail-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.1 2.3 4.5 6 4c2.1-.3 3.9.8 6 3 2.1-2.2 3.9-3.3 6-3 3.7.5 5.5 4.1 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
        </span>
        <span class="like-count">0</span>
      </button>
      <button class="rail-btn info" aria-label="Info">
        <span class="rail-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="lbl-info">детали</span>
      </button>
      <button class="rail-btn shuffle" aria-label="Next">
        <span class="rail-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 3l4 4-4 4"/><path d="M3 7h6c2 0 2.5.5 4 2.5"/><path d="M17 21l4-4-4-4"/><path d="M3 17h6c2 0 2.5-.5 4-2.5"/></svg>
        </span>
        <span class="lbl-next">дальше</span>
      </button>
      <a class="rail-btn source" target="_blank" rel="noopener" aria-label="Source">
        <span class="rail-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
        </span>
        <span class="lbl-source">музей</span>
      </a>
    </div>

    <div class="heart-burst">
      <svg viewBox="0 0 24 24" fill="var(--like)"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.1 2.3 4.5 6 4c2.1-.3 3.9.8 6 3 2.1-2.2 3.9-3.3 6-3 3.7.5 5.5 4.1 4 7.7C19.5 16.4 12 21 12 21z"/></svg>
    </div>
  </section>
</template>

<script>
(function(){
  const feed = document.getElementById('feed');
  const boot = document.getElementById('boot');
  const hint = document.getElementById('hint');
  const tpl = document.getElementById('slide-tpl');
  const gear = document.getElementById('settings-gear');
  const panel = document.getElementById('settings-panel');

  let lang = 'ru';
  let counter = 0;
  let loading = false;
  let observer;
  let hintShown = false;
  const translationCache = {};

  const STRINGS = {
    ru: {
      eyebrow: 'Random Masterworks',
      hint: '↑ ↓ листайте, как ленту ↑ ↓',
      like: 'нрав.',
      info: 'детали',
      next: 'дальше',
      source: 'музей',
      bootSub: 'собираем ленту',
      errorMsg: 'Не удалось загрузить картины.<br>Проверьте подключение к интернету.',
      retry: 'Повторить',
      panelTitle: 'Язык',
      panelNote: 'Тексты картин переводятся автоматически.',
      untitled: 'Без названия',
      unknownArtist: 'Автор неизвестен',
      mediumFallback: 'Материал не указан',
      accPrefix: 'AIC · инв. ',
      settingsAria: 'Настройки'
    },
    en: {
      eyebrow: 'Random Masterworks',
      hint: '↑ ↓ swipe like a feed ↑ ↓',
      like: 'like',
      info: 'details',
      next: 'next',
      source: 'museum',
      bootSub: 'building your feed',
      errorMsg: "Couldn't load paintings.<br>Check your internet connection.",
      retry: 'Retry',
      panelTitle: 'Language',
      panelNote: 'Artwork text is translated automatically.',
      untitled: 'Untitled',
      unknownArtist: 'Unknown artist',
      mediumFallback: 'Medium not specified',
      accPrefix: 'AIC · inv. ',
      settingsAria: 'Settings'
    }
  };

  const AIC_FIELDS = 'id,title,artist_display,date_display,medium_display,image_id';

  function t(key){ return STRINGS[lang][key]; }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  async function translateText(text, target){
    if(!text) return text;
    const key = target + '::' + text;
    if(translationCache[key]) return translationCache[key];
    try{
      const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|' + target;
      const res = await fetch(url);
      const data = await res.json();
      const translated = (data && data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
      translationCache[key] = translated;
      return translated;
    }catch(e){
      return text;
    }
  }

  async function fetchBatch(count){
    const results = [];
    let attempts = 0;
    while(results.length < count && attempts < 10){
      attempts++;
      const page = Math.floor(Math.random()*450) + 1;
      const query = {
        bool:{
          must:[{ term:{ is_public_domain:true } }],
          filter:[{ exists:{ field:'image_id' } }]
        }
      };
      const url = 'https://api.artic.edu/api/v1/artworks/search'
        + '?query=' + encodeURIComponent(JSON.stringify(query))
        + '&fields=' + AIC_FIELDS
        + '&limit=20&page=' + page;
      try{
        const res = await fetch(url);
        if(!res.ok) continue;
        const data = await res.json();
        const items = shuffle((data.data || []).filter(a => a.image_id));
        for(const a of items){
          if(results.length >= count) break;
          results.push({
            id: a.id,
            title: a.title || null,
            artist: (a.artist_display || '').split('\n')[0] || null,
            date: a.date_display || '',
            medium: a.medium_display || null,
            img: 'https://www.artic.edu/iiif/2/' + a.image_id + '/full/1200,/0/default.jpg',
            source: 'https://www.artic.edu/artworks/' + a.id
          });
        }
      }catch(e){
        console.error('fetch error', e);
      }
    }
    return results;
  }

  async function applySlideLanguage(node, animate){
    const titleEl = node.querySelector('.plaque-title');
    const artistEl = node.querySelector('.plaque-artist');
    const mediumEl = node.querySelector('.plaque-medium');
    const enTitle = node.dataset.title || t('untitled');
    const enArtist = node.dataset.artist || t('unknownArtist');
    const enMedium = node.dataset.medium || t('mediumFallback');

    node.querySelector('.eyebrow').textContent = t('eyebrow');
    node.querySelector('.lbl-info').textContent = t('info');
    node.querySelector('.lbl-next').textContent = t('next');
    node.querySelector('.lbl-source').textContent = t('source');
    node.querySelector('.plaque-acc').textContent = t('accPrefix') + node.dataset.id;

    if(animate){
      [titleEl, artistEl, mediumEl].forEach(el => el.classList.add('fade-swap'));
    }

    if(lang === 'en'){
      titleEl.textContent = enTitle;
      artistEl.textContent = enArtist;
      mediumEl.textContent = enMedium;
      [titleEl, artistEl, mediumEl].forEach(el => el.classList.remove('fade-swap'));
      return;
    }

    titleEl.textContent = translationCache['ru::' + enTitle] || enTitle;
    artistEl.textContent = translationCache['ru::' + enArtist] || enArtist;
    mediumEl.textContent = translationCache['ru::' + enMedium] || enMedium;
    [titleEl, artistEl, mediumEl].forEach(el => el.classList.remove('fade-swap'));

    const targetLangAtCallTime = lang;
    const [tt, ta, tm] = await Promise.all([
      translateText(enTitle, 'ru'),
      translateText(enArtist, 'ru'),
      translateText(enMedium, 'ru')
    ]);
    if(lang === targetLangAtCallTime && lang === 'ru'){
      titleEl.textContent = tt;
      artistEl.textContent = ta;
      mediumEl.textContent = tm;
    }
  }

  function buildSlide(item, index){
    const node = tpl.content.firstElementChild.cloneNode(true);
    const frame = node.querySelector('.art-frame');
    const img = node.querySelector('.art-img');
    img.src = item.img;
    img.alt = (item.title || 'artwork') + ' — ' + (item.artist || '');
    img.addEventListener('load', () => img.classList.add('loaded'));
    frame.style.setProperty('background-image', 'url(' + item.img + ')');

    node.dataset.id = item.id;
    node.dataset.title = item.title || '';
    node.dataset.artist = item.artist || '';
    node.dataset.medium = item.medium || '';

    node.querySelector('.counter').textContent = String(index + 1).padStart(2,'0');
    node.querySelector('.plaque-meta').textContent = item.date;
    node.querySelector('.source').href = item.source;

    applySlideLanguage(node, false);

    const likeBtn = node.querySelector('.like');
    const likeCount = node.querySelector('.like-count');
    const heartBurst = node.querySelector('.heart-burst');
    let liked = false;
    let baseLikes = 40 + (item.id % 900);
    likeCount.textContent = baseLikes;

    function doLike(showBurst){
      liked = !liked;
      likeBtn.classList.toggle('active', liked);
      likeCount.textContent = liked ? baseLikes + 1 : baseLikes;
      if(liked && showBurst){
        heartBurst.classList.remove('play');
        void heartBurst.offsetWidth;
        heartBurst.classList.add('play');
      }
    }
    likeBtn.addEventListener('click', () => doLike(true));

    let lastTap = 0;
    node.querySelector('.art-frame').addEventListener('click', () => {
      const now = Date.now();
      if(now - lastTap < 320){
        if(!liked) doLike(true);
        else{
          heartBurst.classList.remove('play');
          void heartBurst.offsetWidth;
          heartBurst.classList.add('play');
        }
      }
      lastTap = now;
    });

    const infoBtn = node.querySelector('.info');
    const extra = node.querySelector('.plaque-extra');
    infoBtn.addEventListener('click', () => {
      const open = extra.classList.toggle('open');
      infoBtn.classList.toggle('active', open);
    });

    node.querySelector('.shuffle').addEventListener('click', () => {
      const current = node;
      const next = current.nextElementSibling;
      loadMore(1, current);
      if(next){
        next.scrollIntoView({ behavior:'smooth', block:'start' });
      }
    });

    return node;
  }

  function attachObserver(node){
    observer.observe(node);
  }

  async function loadMore(count, insertAfter){
    if(loading) return 0;
    loading = true;
    const items = await fetchBatch(count);
    const startIndex = feed.children.length;
    items.forEach((item, i) => {
      const node = buildSlide(item, startIndex + i);
      if(insertAfter){
        insertAfter.after(node);
      }else{
        feed.appendChild(node);
      }
      attachObserver(node);
    });
    loading = false;
    return items.length;
  }

  function setupObserver(){
    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          const idx = Array.from(feed.children).indexOf(entry.target);
          if(idx >= feed.children.length - 2){
            loadMore(4);
          }
          if(!hintShown){
            hintShown = true;
            hint.style.transition = 'opacity .6s ease';
            hint.style.opacity = '0';
            setTimeout(() => hint.remove(), 700);
          }
        }
      });
    }, { root: feed, threshold: 0.6 });
  }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const h = feed.clientHeight;
      feed.scrollBy({ top: e.key === 'ArrowDown' ? h : -h, behavior:'smooth' });
    }
  });

  function applyGlobalStrings(){
    if(hint && hint.parentNode) hint.textContent = t('hint');
    const bootSub = document.getElementById('boot-sub');
    if(bootSub) bootSub.textContent = t('bootSub');
    document.getElementById('panel-title').textContent = t('panelTitle');
    document.getElementById('panel-note').textContent = t('panelNote');
    gear.setAttribute('aria-label', t('settingsAria'));
    document.querySelectorAll('.lang-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    const status = document.querySelector('.status');
    if(status){
      status.innerHTML = '<div>' + t('errorMsg') + '</div><button class="retry-btn" onclick="location.reload()">' + t('retry') + '</button>';
    }
  }

  function setLanguage(newLang){
    if(newLang === lang) return;
    lang = newLang;
    applyGlobalStrings();
    Array.from(feed.children).forEach(node => applySlideLanguage(node, true));
  }

  gear.addEventListener('click', () => {
    panel.classList.toggle('open');
    gear.classList.remove('spin');
    void gear.offsetWidth;
    gear.classList.add('spin');
  });

  document.addEventListener('click', (e) => {
    if(!panel.contains(e.target) && e.target !== gear && !gear.contains(e.target)){
      panel.classList.remove('open');
    }
  });

  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  async function boot_init(){
    applyGlobalStrings();
    setupObserver();
    const first = await loadMore(6);
    boot.style.transition = 'opacity .5s ease';
    boot.style.opacity = '0';
    setTimeout(() => boot.remove(), 550);
    if(!first){
      feed.innerHTML = '<div class="status"><div>' + t('errorMsg') + '</div><button class="retry-btn" onclick="location.reload()">' + t('retry') + '</button></div>';
    }
  }

  boot_init();
})();
</script>
</body>
</html>
